<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ADALAM Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --ink:#163024; --green:#178a38; --deep:#0f6a2b; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; font-family:Nunito, system-ui, sans-serif; color:var(--ink); background:#dff6ea; }
    button, input { font:inherit; }
    .app { max-width:1100px; margin:0 auto; padding:12px 12px 24px; min-height:100%; }
    .top { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:900; }
    .brand img { height:40px; }
    h1 { font-size:clamp(1.7rem, 4vw, 2.4rem); margin:12px 0 8px; }
    .card { background:#fffdf8; border-radius:28px; padding:16px; box-shadow:0 18px 40px rgba(22,48,36,.08); }
    label { font-weight:800; display:block; margin-bottom:6px; }
    input[type="text"] {
      width:min(100%, 320px); font-weight:800; font-size:1.05rem; padding:12px 14px;
      border-radius:14px; border:2px solid #d7eadf; text-transform:uppercase;
    }
    .btn {
      border:0; cursor:pointer; font-weight:900; color:#fff; background:var(--green);
      border-radius:999px; padding:14px 22px; box-shadow:0 8px 0 var(--deep);
    }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
    .stage { position:relative; margin-top:10px; }
    canvas { width:100%; height:min(68vh, 640px); display:block; border-radius:22px; background:#c8f0dc; touch-action:none; }
    .goal {
      position:absolute; left:12px; right:12px; top:12px; z-index:2;
      background:rgba(255,253,248,.94); border-radius:16px; padding:10px 14px;
      font-weight:900; font-size:clamp(1rem, 2.4vw, 1.25rem); text-align:center;
    }
    .dpad {
      position:absolute; left:12px; bottom:12px; z-index:2;
      display:grid; grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px 52px; gap:4px;
    }
    .dpad button {
      border:0; border-radius:14px; background:rgba(255,255,255,.92); font-weight:900; font-size:1.2rem;
      box-shadow:0 4px 0 #d7eadf; cursor:pointer; touch-action:none;
    }
    .dpad .u { grid-column:2; grid-row:1; }
    .dpad .l { grid-column:1; grid-row:2; }
    .dpad .r { grid-column:3; grid-row:2; }
    .dpad .d { grid-column:2; grid-row:3; }
    .hidden { display:none !important; }
    .bars { display:flex; flex-direction:column; gap:12px; }
    .bar-top { display:flex; justify-content:space-between; gap:8px; font-weight:900; }
    .track { height:20px; border-radius:999px; background:#edf2ef; overflow:hidden; }
    .fill { height:100%; width:0; background:linear-gradient(90deg,#f4a338,#1a8f3b); transition:width .7s ease; }
    .iie { margin-top:14px; display:flex; justify-content:space-between; align-items:center; background:#163024; color:#fff; border-radius:16px; padding:12px 14px; font-weight:900; }
    .iie span { background:#2563eb; border-radius:10px; padding:4px 10px; font-size:1.3rem; }
    .note { margin-top:12px; background:#fff8dc; border-radius:16px; padding:12px 14px; }
    .shake { animation:shake .35s linear; }
    @keyframes shake { 25% { transform:translateX(-6px); } 50% { transform:translateX(6px); } 75% { transform:translateX(-3px); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand"><img src="assets/logo_adalam.webp" alt="ADALAM"/> ADALAM Play</div>
    </div>

    <section id="home">
      <h1>Camina por el patio.</h1>
      <div class="card">
        <label for="nombre">Tu nombre</label>
        <input id="nombre" maxlength="40" autocomplete="off" placeholder="Ej. ANA"/>
        <div class="row">
          <button class="btn" id="btnJugar" type="button">JUGAR</button>
        </div>
      </div>
    </section>

    <section id="play" class="hidden">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="goal" id="goal"></div>
        <div class="dpad" id="dpad">
          <button class="u" type="button" data-k="up">▲</button>
          <button class="l" type="button" data-k="left">◀</button>
          <button class="r" type="button" data-k="right">▶</button>
          <button class="d" type="button" data-k="down">▼</button>
        </div>
      </div>
    </section>

    <section id="done" class="hidden">
      <h1 id="doneTitle">Tu estilo</h1>
      <div class="card">
        <div class="bars" id="bars"></div>
        <div class="iie">Índice de la escena <span id="iie">—</span></div>
        <div class="note" id="bossNote"></div>
        <div class="row">
          <button class="btn" id="btnOtra" type="button">JUGAR OTRA VEZ</button>
          <a class="btn" href="index.html" style="text-decoration:none;background:#fff;color:#163024;box-shadow:0 8px 0 #e5efe8">Volver al menú</a>
        </div>
      </div>
    </section>
  </div>
  <script>
    var WORLD_W = 1600, WORLD_H = 900;
    var BASE = "assets/demo-juego/escena/";
    var SCENES = [
      {
        block: "personal",
        line: "Se cayeron los bloques. Camina hasta un círculo.",
        pads: [
          { x: 640, y: 640, pts: 3, label: "Lo levanto", act: "stack" },
          { x: 800, y: 760, pts: 2, label: "Espero", act: "wait" },
          { x: 960, y: 640, pts: 1, label: "Lo dejo", act: "leave" }
        ]
      },
      {
        block: "vinculos",
        line: "Él está callado. Camina hasta un círculo.",
        pads: [
          { x: 250, y: 700, pts: 3, label: "Me acerco", act: "hello" },
          { x: 430, y: 800, pts: 2, label: "Lo miro", act: "look" },
          { x: 600, y: 680, pts: 1, label: "Frase dura", act: "harsh-boy" }
        ]
      },
      {
        block: "vida",
        line: "El grupo no arranca. Camina hasta un círculo.",
        pads: [
          { x: 1080, y: 680, pts: 3, label: "Propongo", act: "lead" },
          { x: 1260, y: 800, pts: 2, label: "Espero", act: "wait" },
          { x: 1440, y: 680, pts: 1, label: "Frase dura", act: "harsh-group" }
        ]
      }
    ];

    var sprites = {};
    var keys = { left:false, right:false, up:false, down:false };
    var player = { x: 800, y: 870, flip: false, walk: 0 };
    var boy = { x: 380, y: 560, homeX: 380, mood: "calma" };
    var group = { x: 1260, y: 540, homeX: 1260, mood: "calma" };
    var blocks = { x: 800, y: 560, rise: 0 };
    var sceneIndex = 0;
    var phase = "home";
    var dwell = { i: -1, t: 0 };
    var results = [];
    var bubble = null;
    var shake = 0;
    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var dpr = 1;
    var voice = new Audio("assets/demo-juego/audio/camina.mp3");

    function loadImage(src) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () { resolve(img); };
        img.onerror = reject;
        img.src = src;
      });
    }

    function show(which) {
      ["home", "play", "done"].forEach(function (id) {
        document.getElementById(id).classList.toggle("hidden", id !== which);
      });
    }

    function resize() {
      var r = cv.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.floor(r.width * dpr));
      cv.height = Math.max(1, Math.floor(r.height * dpr));
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function drawSprite(img, x, y, h, flip) {
      if (!img) return;
      var w = h * (img.width / img.height);
      ctx.save();
      ctx.translate(x, y);
      if (flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -w / 2, -h, w, h);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBlocks() {
      var cols = ["#f4a338", "#7dce8a", "#8ec8f5"];
      for (var i = 0; i < 3; i++) {
        var fallenX = blocks.x - 120 + i * 100;
        var fallenY = blocks.y;
        var stackX = blocks.x - 36;
        var stackY = blocks.y - 70 - i * 64;
        var x = fallenX + (stackX - fallenX) * blocks.rise;
        var y = fallenY + (stackY - fallenY) * blocks.rise;
        ctx.fillStyle = cols[i];
        roundRect(x, y, 78, 58, 12);
        ctx.fill();
      }
    }

    function drawPad(pad, hot, fill) {
      ctx.beginPath();
      ctx.arc(pad.x, pad.y, 62, 0, Math.PI * 2);
      ctx.fillStyle = pad.pts === 3 ? "rgba(26,143,59,.88)" : pad.pts === 2 ? "rgba(244,163,56,.92)" : "rgba(232,93,76,.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.beginPath();
      ctx.arc(pad.x, pad.y, 68, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (hot ? fill : 0));
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "900 16px Nunito, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pad.label, pad.x, pad.y);
    }

    function drawBubble(text, x, y) {
      ctx.font = "900 28px Nunito, sans-serif";
      var w = ctx.measureText(text).width + 36;
      ctx.fillStyle = "#fffdf8";
      roundRect(x - w / 2, y - 78, w, 52, 16);
      ctx.fill();
      ctx.fillStyle = "#163024";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y - 52);
    }

    function draw() {
      var cw = cv.width / dpr;
      var ch = cv.height / dpr;
      var s = Math.min(cw / WORLD_W, ch / WORLD_H);
      var ox = (cw - WORLD_W * s) / 2;
      var oy = (ch - WORLD_H * s) / 2;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
      if (shake > 0) ctx.translate((Math.random() - 0.5) * 14, 0);
      if (sprites.patio) ctx.drawImage(sprites.patio, 0, 0, WORLD_W, WORLD_H);
      drawBlocks();
      var scene = SCENES[sceneIndex];
      if (phase === "play" && scene) scene.pads.forEach(function (pad, i) {
        drawPad(pad, dwell.i === i, dwell.t / 0.45);
      });
      var boyImg = boy.mood === "susto" ? sprites.susto : sprites.nino;
      var groupImg = group.mood === "susto" ? sprites.gsusto : sprites.gcalma;
      drawSprite(boyImg, boy.x, boy.y, 250, false);
      drawSprite(groupImg, group.x, group.y, 230, false);
      var frame = (player.walk % 0.28) < 0.14 ? sprites.paso : sprites.nina;
      if (!keys.left && !keys.right && !keys.up && !keys.down) frame = sprites.nina;
      ctx.fillStyle = "rgba(22,48,36,.18)";
      ctx.beginPath();
      ctx.ellipse(player.x, player.y - 6, 42, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      drawSprite(frame, player.x, player.y + Math.sin(player.walk * 18) * 4, 270, player.flip);
      if (bubble) drawBubble(bubble.text, bubble.x, bubble.y);
    }

    function currentPads() {
      var scene = SCENES[sceneIndex];
      return scene ? scene.pads : [];
    }

    async function react(act, pad) {
      phase = "react";
      dwell = { i: -1, t: 0 };
      if (act === "stack") {
        await tween(blocks, { rise: 1 }, 500);
      } else if (act === "hello") {
        bubble = { text: "Hola, ¿estás bien?", x: player.x, y: player.y - 230 };
        await tween(boy, { x: boy.homeX + 50 }, 400);
      } else if (act === "harsh-boy") {
        bubble = { text: "¡Quítate de ahí!", x: player.x, y: player.y - 230 };
        boy.mood = "susto";
        shake = 8;
        await tween(boy, { x: boy.homeX - 90 }, 380);
      } else if (act === "lead") {
        bubble = { text: "Empecemos por aquí", x: player.x, y: player.y - 230 };
        await tween(group, { x: group.homeX - 60 }, 400);
      } else if (act === "harsh-group") {
        bubble = { text: "¡Apúrense ya!", x: player.x, y: player.y - 230 };
        group.mood = "susto";
        shake = 8;
        await tween(group, { x: group.homeX + 80 }, 380);
      } else {
        bubble = { text: "...", x: player.x, y: player.y - 230 };
        await wait(350);
      }
      results.push({ block: SCENES[sceneIndex].block, pts: pad.pts });
      await wait(700);
      bubble = null;
      shake = 0;
      sceneIndex += 1;
      if (sceneIndex >= SCENES.length) {
        showProfile();
        return;
      }
      document.getElementById("goal").textContent = SCENES[sceneIndex].line;
      phase = "play";
    }

    function tween(obj, props, ms) {
      var from = {};
      Object.keys(props).forEach(function (k) { from[k] = obj[k]; });
      var t0 = performance.now();
      return new Promise(function (resolve) {
        function step(now) {
          var u = Math.min(1, (now - t0) / ms);
          var e = u * u * (3 - 2 * u);
          Object.keys(props).forEach(function (k) { obj[k] = from[k] + (props[k] - from[k]) * e; });
          if (u < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function update(dt) {
      if (phase !== "play") return;
      var vx = 0, vy = 0;
      if (keys.left) vx -= 1;
      if (keys.right) vx += 1;
      if (keys.up) vy -= 1;
      if (keys.down) vy += 1;
      var moving = vx !== 0 || vy !== 0;
      if (moving) {
        var len = Math.hypot(vx, vy);
        player.x = clamp(player.x + (vx / len) * 340 * dt, 90, WORLD_W - 90);
        player.y = clamp(player.y + (vy / len) * 340 * dt, 280, WORLD_H - 20);
        player.walk += dt;
        if (vx) player.flip = vx < 0;
      }
      var pads = currentPads();
      var found = -1;
      for (var i = 0; i < pads.length; i++) {
        if (Math.hypot(player.x - pads[i].x, player.y - pads[i].y) < 62) found = i;
      }
      if (found === -1) dwell = { i: -1, t: 0 };
      else if (dwell.i !== found) dwell = { i: found, t: 0 };
      else {
        dwell.t += dt;
        if (dwell.t >= 0.45) react(pads[found].act, pads[found]);
      }
    }

    var last = 0;
    function loop(now) {
      if (!last) last = now;
      var dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      if (shake > 0) shake -= 1;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function band(n) {
      if (n <= 40) return "Por desarrollar";
      if (n <= 70) return "Por fortalecer";
      return "Por enriquecer";
    }
    function pct(block) {
      var rows = results.filter(function (p) { return p.block === block; });
      if (!rows.length) return 0;
      var sum = rows.reduce(function (a, p) { return a + p.pts; }, 0);
      return Math.round(sum / (rows.length * 3) * 100);
    }
    function showProfile() {
      phase = "done";
      var personal = pct("personal");
      var vinculos = pct("vinculos");
      var vida = pct("vida");
      var iie = Math.round((personal + vinculos + vida) / 3);
      document.getElementById("doneTitle").textContent = document.getElementById("nombre").value.trim() || "Jugador";
      var bars = document.getElementById("bars");
      bars.replaceChildren();
      [["Desarrollo personal", personal], ["Vínculos", vinculos], ["Habilidades para la vida", vida]].forEach(function (row) {
        var wrap = document.createElement("div");
        wrap.innerHTML = '<div class="bar-top"><span>' + row[0] + '</span><span>' + row[1] + " · " + band(row[1]) + '</span></div><div class="track"><div class="fill" data-w="' + row[1] + '"></div></div>';
        bars.appendChild(wrap);
      });
      document.getElementById("iie").textContent = String(iie);
      document.getElementById("bossNote").textContent = "La niña caminó con las flechas y el patio reaccionó. Cada círculo valió 3, 2 o 1, como en la prueba. Es una escena, no las 7 pruebas completas.";
      show("done");
      requestAnimationFrame(function () {
        document.querySelectorAll(".fill").forEach(function (el) { el.style.width = el.getAttribute("data-w") + "%"; });
      });
    }

    function resetWorld() {
      player.x = 800; player.y = 870; player.flip = false; player.walk = 0;
      boy.x = boy.homeX; boy.mood = "calma";
      group.x = group.homeX; group.mood = "calma";
      blocks.rise = 0;
      sceneIndex = 0;
      results = [];
      bubble = null;
      dwell = { i: -1, t: 0 };
      document.getElementById("goal").textContent = SCENES[0].line;
    }

    document.getElementById("nombre").addEventListener("input", function () {
      var el = document.getElementById("nombre");
      var start = el.selectionStart;
      var next = el.value.toLocaleUpperCase("es-EC");
      if (el.value !== next) { el.value = next; try { el.setSelectionRange(start, start); } catch (e) {} }
    });

    document.addEventListener("keydown", function (ev) {
      var map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down", a:"left", d:"right", w:"up", s:"down", A:"left", D:"right", W:"up", S:"down" };
      if (map[ev.key]) { keys[map[ev.key]] = true; ev.preventDefault(); }
    });
    document.addEventListener("keyup", function (ev) {
      var map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down", a:"left", d:"right", w:"up", s:"down", A:"left", D:"right", W:"up", S:"down" };
      if (map[ev.key]) keys[map[ev.key]] = false;
    });

    document.getElementById("dpad").querySelectorAll("button").forEach(function (btn) {
      var k = btn.getAttribute("data-k");
      function down(ev) { ev.preventDefault(); keys[k] = true; }
      function up() { keys[k] = false; }
      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointerleave", up);
      btn.addEventListener("pointercancel", up);
    });

    document.getElementById("btnJugar").addEventListener("click", function () {
      resetWorld();
      phase = "play";
      show("play");
      requestAnimationFrame(function () { resize(); });
      voice.play().catch(function () {});
    });
    document.getElementById("btnOtra").addEventListener("click", function () {
      phase = "home";
      show("home");
    });
    window.addEventListener("resize", resize);

    Promise.all([
      loadImage(BASE + "patio-suelo.png"),
      loadImage(BASE + "nina-quiet.png"),
      loadImage(BASE + "nina-paso.png"),
      loadImage(BASE + "nino-calma.png"),
      loadImage(BASE + "nino-susto.png"),
      loadImage(BASE + "grupo-calma.png"),
      loadImage(BASE + "grupo-susto.png")
    ]).then(function (imgs) {
      sprites.patio = imgs[0];
      sprites.nina = imgs[1];
      sprites.paso = imgs[2];
      sprites.nino = imgs[3];
      sprites.susto = imgs[4];
      sprites.gcalma = imgs[5];
      sprites.gsusto = imgs[6];
      resize();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
