<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ADALAM Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --ink:#163024; --green:#178a38; --deep:#0f6a2b; --card:#fffdf8; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:Nunito, system-ui, sans-serif; color:var(--ink); }
    body {
      background:
        radial-gradient(900px 420px at 8% -10%, #fff3c4 0%, transparent 55%),
        radial-gradient(800px 480px at 110% 0%, #d7fff0 0%, transparent 50%),
        linear-gradient(180deg, #f4fbff 0%, #e7fff4 100%);
    }
    button, input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .app { max-width:920px; margin:0 auto; padding:16px 16px 48px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:.02em; }
    .brand img { height:42px; width:auto; }
    .icon-btn {
      width:44px; height:44px; border-radius:50%; border:0; background:#fff; cursor:pointer;
      box-shadow:0 8px 18px rgba(22,48,36,.08); display:grid; place-items:center;
    }
    .icon-btn.off { opacity:.45; }
    .top-actions { display:flex; gap:8px; }
    h1 { font-size:clamp(1.9rem, 4vw, 2.7rem); line-height:1.02; margin:18px 0 8px; }
    .lead { font-size:1.12rem; margin:0 0 16px; max-width:38rem; }
    .card {
      background:var(--card); border-radius:28px; padding:18px;
      box-shadow:0 18px 40px rgba(22,48,36,.08);
    }
    label { font-weight:800; display:block; margin-bottom:6px; }
    input[type="text"] {
      width:min(100%, 360px); font-weight:800; font-size:1.05rem;
      padding:12px 14px; border-radius:14px; border:2px solid #d7eadf; text-transform:uppercase;
    }
    input.need { border-color:#e07a2f; }
    .btn {
      appearance:none; border:0; cursor:pointer; font-weight:900; color:#fff;
      background:var(--green); border-radius:999px; padding:14px 22px; font-size:1.05rem;
      box-shadow:0 10px 0 var(--deep);
    }
    .btn:active { transform:translateY(2px); box-shadow:0 8px 0 var(--deep); }
    .btn.ghost { background:#fff; color:var(--ink); box-shadow:0 8px 0 #e5efe8; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px; }
    .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:16px; }
    .step { background:#fff; border-radius:18px; padding:12px; font-weight:800; box-shadow:0 8px 18px rgba(22,48,36,.05); }
    .step b { display:block; color:var(--green); font-size:.82rem; letter-spacing:.04em; }
    .scene { width:100%; height:168px; object-fit:cover; object-position:center 28%; border-radius:22px; display:block; background:#dff6ea; }
    #play .scene { height:112px; }
    .kicker { font-weight:900; color:var(--green); letter-spacing:.04em; margin:14px 0 0; }
    .story { font-size:clamp(1.35rem, 3vw, 1.8rem); font-weight:900; margin:6px 0; }
    .play-top { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; margin-bottom:8px; }
    .play-top h2 { margin:0; font-size:1.35rem; }
    .objective { margin:8px 0 0; font-weight:800; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .objective img, .goal img { width:28px; height:28px; object-fit:contain; }
    .plan { display:flex; gap:8px; margin-top:10px; }
    .goal { width:54px; height:54px; border-radius:16px; background:#fff; display:grid; place-items:center; box-shadow:0 6px 0 #eadfca; opacity:.45; }
    .goal img { width:40px; height:40px; }
    .goal.now { opacity:1; outline:4px solid #f4a338; transform:scale(1.18); }
    .goal.done { opacity:1; outline:3px solid var(--green); }
    .stage { position:relative; margin-top:12px; }
    .board {
      display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;
      width:min(100%, 470px); margin:0 auto; padding:10px; border-radius:24px;
      background:linear-gradient(180deg, #fff6e4, #ffe8bf);
      box-shadow:inset 0 0 0 3px #f3d7a2, 0 16px 30px rgba(120,72,10,.08);
    }
    .cell {
      aspect-ratio:1; border:0; border-radius:16px; background:#fffdf8; padding:3px; cursor:pointer;
      box-shadow:0 5px 0 #eadfca; position:relative;
    }
    .cell img { width:100%; height:100%; object-fit:contain; pointer-events:none; user-select:none; }
    .cell.sel { transform:translateY(-7px); box-shadow:0 12px 0 #b7e0c4; }
    .cell.dim { opacity:.28; filter:grayscale(.35); }
    .cell .num {
      position:absolute; inset:0; display:grid; place-items:center;
      font-size:clamp(1.8rem, 5vw, 2.6rem); font-weight:900; color:#fff;
      background:rgba(244,163,56,.92); border-radius:14px; pointer-events:none;
    }
    .cell .finger {
      position:absolute; right:0; bottom:-2px; font-size:26px;
      pointer-events:none; animation:tap .7s ease infinite; z-index:3;
    }
    .coach {
      text-align:center; font-size:clamp(2rem, 7vw, 3.2rem); font-weight:900;
      letter-spacing:.02em; margin:4px 0 10px;
    }
    .goal-pic { width:76px; height:76px; }
    .aqui {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      background:#f4a338; color:#163024; font-weight:900; font-size:.68rem;
      border-radius:999px; padding:3px 5px; pointer-events:none;
    }
    .cell.mark { outline:4px solid #f4a338; outline-offset:1px; animation:bob 1s ease infinite; z-index:1; }
    .cell.heart { box-shadow:0 0 0 3px #ff5d8f, 0 5px 0 #eadfca; animation:bob 1s ease infinite; }
    .cell.stone {
      cursor:default;
      background:
        linear-gradient(135deg, transparent 42%, rgba(90,70,50,.28) 42%, rgba(90,70,50,.28) 48%, transparent 48%),
        linear-gradient(180deg, #e7e1d6, #b7b1a6);
      box-shadow:inset 0 0 0 3px #9c958a, 0 5px 0 #d9d0c2;
    }
    .cell.pop { animation:burst .2s ease forwards; }
    .cell.empty { background:transparent; box-shadow:none; }
    @keyframes burst { 40% { transform:scale(1.12); } 100% { transform:scale(.35); opacity:.05; } }
    @keyframes bob { 50% { transform:translateY(-4px); } }
    @keyframes tap { 50% { transform:translateY(5px); } }
    .pips { display:flex; gap:8px; justify-content:center; margin-top:12px; }
    .pip { width:14px; height:14px; border-radius:50%; background:#d9efe2; }
    .pip.on { background:var(--green); }
    .toast {
      position:absolute; left:50%; top:-38px; transform:translateX(-50%);
      background:#163024; color:#fff; font-weight:900; border-radius:999px; padding:8px 14px;
      opacity:0; pointer-events:none; transition:opacity .2s ease; white-space:nowrap; z-index:2;
    }
    .toast.show { opacity:1; }
    .hidden { display:none !important; }
    .bars { display:flex; flex-direction:column; gap:14px; }
    .bar-top { display:flex; justify-content:space-between; gap:8px; font-weight:900; }
    .track { height:22px; border-radius:999px; background:#edf2ef; overflow:hidden; }
    .fill { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg, #f4a338, #1a8f3b); transition:width .8s ease; }
    .iie {
      margin-top:16px; display:flex; justify-content:space-between; align-items:center;
      background:#163024; color:#fff; border-radius:18px; padding:14px 16px; font-weight:900;
    }
    .iie span { background:#2563eb; border-radius:12px; padding:6px 12px; font-size:1.4rem; }
    .scale { display:flex; justify-content:space-between; font-size:.78rem; font-weight:800; color:#5c7268; margin-top:4px; }
    .note { margin-top:14px; background:#fff8dc; border-radius:16px; padding:12px 14px; }
    @media (max-width:720px) {
      .steps { grid-template-columns:1fr; }
      .scene { height:132px; }
      .board { gap:4px; padding:8px; }
      .cell { border-radius:12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell.hint, .cell.heart { animation:none; }
      .fill { transition:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand"><img src="assets/logo_adalam.webp" alt="ADALAM"/> ADALAM Play</div>
      <div class="top-actions">
        <button class="icon-btn" id="btnReplay" type="button" aria-label="Volver a escuchar">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#163024" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
        </button>
        <button class="icon-btn" id="btnMute" type="button" aria-label="Silencio">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#163024" d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        </button>
      </div>
    </div>

    <section id="home">
      <h1>Toca Jugar.</h1>
      <div class="card">
        <label for="nombre">Tu nombre</label>
        <input id="nombre" type="text" maxlength="40" autocomplete="off" placeholder="Ej. ANA"/>
        <div class="row">
          <button class="btn" id="btnJugar" type="button">JUGAR</button>
          <button class="btn ghost" id="btnOir" type="button">ESCUCHAR</button>
        </div>
      </div>
    </section>

    <section id="splash" class="hidden">
      <div class="card">
        <img class="scene" id="splashScene" alt=""/>
        <p class="kicker" id="splashKicker">Mundo</p>
        <div class="story" id="splashTitle"></div>
        <p class="lead" id="splashLead"></p>
        <button class="btn" id="btnEntrar" type="button" data-mode="enter">ENTRAR</button>
      </div>
    </section>

    <section id="play" class="hidden">
      <div class="play-top">
        <h2 id="worldName">Patio</h2>
        <div id="worldCount">1 / 3</div>
      </div>
      <div class="card">
        <img class="scene" id="scene" alt=""/>
        <div class="coach hidden" id="coach">TOCA EL 1</div>
        <div class="objective" id="objective"></div>
        <div class="plan hidden" id="plan"></div>
        <div class="stage">
          <div class="toast" id="toast"></div>
          <div class="board" id="board"></div>
        </div>
        <div class="pips" id="pips"></div>
      </div>
    </section>

    <section id="done" class="hidden">
      <h1 id="doneTitle">Tu estilo</h1>
      <p class="lead">Así quedó la partida.</p>
      <div class="card">
        <div class="bars" id="bars"></div>
        <div class="iie">Índice de la partida <span id="iie">—</span></div>
        <div class="scale"><span>Por desarrollar</span><span>Por fortalecer</span><span>Por enriquecer</span></div>
        <div class="note" id="bossNote"></div>
        <div class="row">
          <button class="btn" id="btnOtra" type="button">JUGAR OTRA VEZ</button>
          <a class="btn ghost" href="index.html" style="text-decoration:none">Volver al menú</a>
        </div>
      </div>
    </section>
  </div>
  <script src="demo-juego-engine.js"></script>
  <script>
    var E = window.AdalamPlay;
    var TILES = [
      "assets/demo-juego/tile-sol.png",
      "assets/demo-juego/tile-gota.png",
      "assets/demo-juego/tile-hoja.png",
      "assets/demo-juego/tile-estrella.png",
      "assets/demo-juego/tile-rayo.png",
      "assets/demo-juego/tile-corazon.png"
    ];
    var AUDIO = "assets/demo-juego/audio/";
    var WORLDS = [
      { block:"personal", name:"Patio", scene:"assets/demo-juego/escena-patio.png", audio:AUDIO + "patio.mp3", kind:"rebuild",
        lead:"Si una columna se pone gris, se cayó. Junta estrellas pegadas a ella y se levanta. Si juntas otras fichas, también sigues." },
      { block:"vinculos", name:"Amigos", scene:"assets/demo-juego/escena-amigos.png", audio:AUDIO + "amigos.mp3", kind:"heart",
        lead:"Vas a ver un corazón encerrado. Junta fichas pegadas a él y se abre. Tú eliges por dónde jugar." },
      { block:"vida", name:"La meta", scene:"assets/demo-juego/escena-meta.png", audio:AUDIO + "meta.mp3", kind:"plan",
        lead:"Arriba hay un plan: primero el sol, después la hoja y al final la estrella. Junta la ficha marcada." }
    ];

    var voice = new Audio();
    var lastVoice = AUDIO + "instrucciones.mp3";
    var muted = false;
    var ctx = null;
    var worldIndex = 0;
    var results = [];
    var grid = null;
    var situation = null;
    var worldPts = [];
    var sel = null;
    var busy = false;
    var levelOver = false;
    var hinted = false;
    var guide = 0;
    var guidePair = null;
    var toastTimer = 0;

    var home = document.getElementById("home");
    var splash = document.getElementById("splash");
    var play = document.getElementById("play");
    var done = document.getElementById("done");
    var nombre = document.getElementById("nombre");
    var board = document.getElementById("board");
    var btnEntrar = document.getElementById("btnEntrar");

    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

    function show(which) {
      home.classList.toggle("hidden", which !== "home");
      splash.classList.toggle("hidden", which !== "splash");
      play.classList.toggle("hidden", which !== "play");
      done.classList.toggle("hidden", which !== "done");
    }

    function say(src) {
      lastVoice = src;
      if (muted) return;
      voice.pause();
      voice.src = src;
      var played = voice.play();
      if (played && played.catch) played.catch(function () {});
    }

    function sfx(freq) {
      if (muted) return;
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.17);
    }

    function toast(text) {
      var el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1200);
    }

    nombre.addEventListener("input", function () {
      nombre.classList.remove("need");
      var start = nombre.selectionStart;
      var next = nombre.value.toLocaleUpperCase("es-EC");
      if (nombre.value !== next) {
        nombre.value = next;
        try { nombre.setSelectionRange(start, start); } catch (e) {}
      }
    });

    function icon(type) {
      var img = document.createElement("img");
      img.src = TILES[type];
      img.alt = "";
      return img;
    }

    function setObjective() {
      var el = document.getElementById("objective");
      var plan = document.getElementById("plan");
      var w = WORLDS[worldIndex];
      document.getElementById("worldName").textContent = w.name;
      document.getElementById("worldCount").textContent = (worldIndex + 1) + " / 3";
      el.replaceChildren();
      if (guide) {
        plan.classList.add("hidden");
        return;
      }
      if (!situation || situation.kind !== "plan") plan.classList.add("hidden");
      if (!situation) return;
      if (situation.kind === "rebuild") {
        var big = icon(E.ESTRELLA);
        big.className = "goal-pic";
        el.appendChild(big);
        return;
      }
      if (situation.kind === "heart") return;
      if (situation.step >= situation.need.length) return;
      plan.classList.remove("hidden");
      plan.replaceChildren();
      situation.need.forEach(function (t, i) {
        var d = document.createElement("div");
        d.className = "goal" + (i < situation.step ? " done" : i === situation.step ? " now" : "");
        d.appendChild(icon(t));
        plan.appendChild(d);
      });
    }

    function renderPips() {
      var box = document.getElementById("pips");
      box.replaceChildren();
      for (var i = 0; i < 3; i++) {
        var p = document.createElement("div");
        p.className = "pip" + (i < worldPts.length ? " on" : "");
        box.appendChild(p);
      }
    }

    function render() {
      var coach = document.getElementById("coach");
      var scene = document.getElementById("scene");
      if (guide && guidePair) {
        coach.classList.remove("hidden");
        coach.textContent = guide === 1 ? "TOCA EL 1" : "AHORA EL 2";
        scene.classList.add("hidden");
      } else {
        coach.classList.add("hidden");
        scene.classList.remove("hidden");
      }
      board.replaceChildren();
      for (var r = 0; r < E.ROWS; r++) {
        for (var c = 0; c < E.COLS; c++) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "cell";
          var cell = grid[r][c];
          var is1 = guidePair && guidePair[0].r === r && guidePair[0].c === c;
          var is2 = guidePair && guidePair[1].r === r && guidePair[1].c === c;
          var active = (guide === 1 && is1) || (guide === 2 && is2);
          if (!cell) b.classList.add("empty");
          else if (cell.stone) b.classList.add("stone");
          else {
            b.appendChild(icon(cell.t));
            if (cell.heart) b.classList.add("heart");
          }
          if (sel && sel.r === r && sel.c === c) b.classList.add("sel");
          if (guide && !active && !(guide === 2 && is1)) b.classList.add("dim");
          if (active) {
            var n = document.createElement("span");
            n.className = "num";
            n.textContent = String(guide);
            b.appendChild(n);
            var hand = document.createElement("span");
            hand.className = "finger";
            hand.textContent = "👇";
            b.appendChild(hand);
          }
          if (!guide && cell && cell.stone && WORLDS[worldIndex].kind === "rebuild") {
            b.classList.add("mark");
            var tag = document.createElement("span");
            tag.className = "aqui";
            tag.textContent = "AQUÍ";
            b.appendChild(tag);
          }
          if (!guide && cell && cell.heart) {
            var tagH = document.createElement("span");
            tagH.className = "aqui";
            tagH.textContent = "AQUÍ";
            b.appendChild(tagH);
          }
          (function (rr, cc) { b.addEventListener("click", function () { onCell(rr, cc); }); })(r, c);
          board.appendChild(b);
        }
      }
      scene.src = WORLDS[worldIndex].scene;
      setObjective();
      renderPips();
    }

    function markPop(cells) {
      cells.forEach(function (m) {
        var el = board.children[m.r * E.COLS + m.c];
        if (el) el.classList.add("pop");
      });
    }

    function applyObstacle() {
      var n = worldPts.length;
      if (WORLDS[worldIndex].kind === "rebuild") {
        var col = [1, 3, 5][n];
        for (var r = E.ROWS - 2; r < E.ROWS; r++) grid[r][col] = { stone: true };
        situation = { kind:"rebuild", col:col, misses:0, seen:false };
      } else {
        var spots = [[4, 1], [4, 5], [2, 3]];
        var s = spots[n];
        grid[s[0]][s[1]] = { t:E.CORAZON, heart:true };
        situation = { kind:"heart", r:s[0], c:s[1], misses:0, seen:false };
      }
    }

    function layoutLevel() {
      var w = WORLDS[worldIndex];
      var tries = 0;
      do {
        grid = E.seedBoard(Math.random);
        if (w.kind === "plan") situation = { kind:"plan", step:0, need:[E.SOL, E.HOJA, E.ESTRELLA], partial:false };
        else applyObstacle();
        tries++;
      } while (tries < 8 && (!E.hasMove(grid) || E.findMatches(grid).length));
    }

    function clearObstacle() {
      if (!situation) return;
      if (situation.kind === "rebuild") {
        for (var r = 0; r < E.ROWS; r++) {
          if (grid[r][situation.col] && grid[r][situation.col].stone) grid[r][situation.col] = null;
        }
      } else if (situation.kind === "heart") {
        grid[situation.r][situation.c] = null;
      }
    }

    async function settleFree() {
      var matched = E.findMatches(grid);
      var guard = 0;
      while (matched.length && guard++ < 8) {
        markPop(matched);
        sfx(480 + guard * 30);
        await wait(160);
        matched.forEach(function (m) { grid[m.r][m.c] = null; });
        E.collapse(grid);
        E.fillHoles(grid, Math.random);
        render();
        await wait(140);
        matched = E.findMatches(grid);
      }
      if (!E.hasMove(grid)) {
        E.reshuffle(grid, Math.random);
        toast("Las fichas se reacomodaron");
        render();
      }
    }

    function cheer(pts, kind) {
      var map = {
        rebuild: ["Seguiste por otro lado", "Tocaste la columna", "¡La columna se levantó!"],
        heart: ["Seguiste de largo", "Te acercaste", "¡El corazón se abrió!"],
        plan: ["El plan avanzó", "Volviste al plan", "¡Esa era!"]
      };
      toast(map[kind][pts - 1]);
      if (pts === 3) sfx(720);
    }

    async function endWorld() {
      if (levelOver) return;
      levelOver = true;
      var w = WORLDS[worldIndex];
      worldPts.forEach(function (pts) { results.push({ block:w.block, pts:pts }); });
      voice.pause();
      await wait(500);
      if (worldIndex >= WORLDS.length - 1) {
        showProfile();
        return;
      }
      document.getElementById("splashScene").src = w.scene;
      document.getElementById("splashKicker").textContent = "Mundo listo";
      document.getElementById("splashTitle").textContent = w.name;
      document.getElementById("splashLead").textContent = "Cuando quieras, pasa al siguiente.";
      btnEntrar.dataset.mode = "next";
      btnEntrar.textContent = "SIGUIENTE MUNDO";
      show("splash");
    }

    async function closeBeat(pts) {
      if (levelOver) return;
      worldPts.push(pts);
      cheer(pts, situation.kind);
      clearObstacle();
      E.collapse(grid);
      E.fillHoles(grid, Math.random);
      render();
      await settleFree();
      renderPips();
      if (worldPts.length >= 3) await endWorld();
      else {
        await wait(280);
        applyObstacle();
        if (!E.hasMove(grid)) E.reshuffle(grid, Math.random);
        render();
      }
    }

    async function onCleared(cleared) {
      if (!situation || levelOver) return;
      if (situation.kind === "plan") {
        var planResult = E.judgePlan(cleared, situation);
        if (planResult.arm) {
          situation.partial = true;
          setObjective();
          toast("El plan marca otra ficha");
          return;
        }
        worldPts.push(planResult.pts);
        situation.partial = false;
        situation.step++;
        cheer(planResult.pts, "plan");
        renderPips();
        if (situation.step >= 3) await endWorld();
        else setObjective();
        return;
      }
      var result = situation.kind === "rebuild" ? E.judgeRebuild(grid, cleared) : E.judgeHeart(grid, cleared);
      if (!result) {
        situation.misses++;
        if (situation.misses >= 3) await closeBeat(1);
        return;
      }
      await closeBeat(result.pts);
    }

    async function onCell(r, c) {
      if (busy || levelOver || !grid) return;
      if (guide && guidePair) {
        var want = guidePair[guide - 1];
        if (!want || r !== want.r || c !== want.c) return;
        if (guide === 1) {
          sel = { r: r, c: c };
          guide = 2;
          render();
          say(AUDIO + "dos.mp3");
          return;
        }
        sel = { r: guidePair[0].r, c: guidePair[0].c };
      }
      var cell = grid[r][c];
      if (!E.isPlay(cell)) return;
      if (!sel) { sel = { r:r, c:c }; render(); return; }
      if (sel.r === r && sel.c === c) { sel = null; render(); return; }
      if (Math.abs(sel.r - r) + Math.abs(sel.c - c) !== 1) { sel = { r:r, c:c }; render(); return; }
      var a = sel;
      sel = null;
      busy = true;
      E.swapCells(grid, a.r, a.c, r, c);
      render();
      await wait(90);
      var matched = E.findMatches(grid);
      if (!matched.length) {
        E.swapCells(grid, a.r, a.c, r, c);
        render();
        sfx(160);
        busy = false;
        return;
      }
      guide = 0;
      guidePair = null;
      hinted = true;
      var cleared = [];
      var guard = 0;
      while (matched.length && guard++ < 12) {
        cleared = cleared.concat(matched);
        markPop(matched);
        sfx(500 + guard * 35);
        await wait(190);
        matched.forEach(function (m) { grid[m.r][m.c] = null; });
        E.collapse(grid);
        E.fillHoles(grid, Math.random);
        render();
        await wait(150);
        matched = E.findMatches(grid);
      }
      if (!E.hasMove(grid)) {
        E.reshuffle(grid, Math.random);
        toast("Las fichas se reacomodaron");
        render();
      }
      await onCleared(cleared);
      busy = false;
    }

    function openSplash() {
      var w = WORLDS[worldIndex];
      document.getElementById("splashScene").src = w.scene;
      document.getElementById("splashKicker").textContent = "Mundo " + (worldIndex + 1) + " de 3";
      document.getElementById("splashTitle").textContent = w.name;
      document.getElementById("splashLead").textContent = "";
      btnEntrar.dataset.mode = "enter";
      btnEntrar.textContent = "ENTRAR";
      show("splash");
      say(w.audio);
    }

    function beginLevel() {
      worldPts = [];
      sel = null;
      busy = false;
      levelOver = false;
      layoutLevel();
      guide = 0;
      guidePair = null;
      if (worldIndex === 0 && !hinted) {
        guidePair = E.findHint(grid);
        guide = guidePair ? 1 : 0;
      }
      show("play");
      render();
      if (guide === 1) say(AUDIO + "uno.mp3");
    }

    function band(n) {
      if (n <= 40) return "Por desarrollar";
      if (n <= 70) return "Por fortalecer";
      return "Por enriquecer";
    }

    function pct(block) {
      var rows = results.filter(function (p) { return p.block === block; });
      if (!rows.length) return 0;
      var sum = rows.reduce(function (a, p) { return a + p.pts; }, 0);
      return Math.round(sum / (rows.length * 3) * 100);
    }

    function showProfile() {
      var personal = pct("personal");
      var vinculos = pct("vinculos");
      var vida = pct("vida");
      var iie = Math.round((personal + vinculos + vida) / 3);
      var who = nombre.value.trim() || "Jugador";
      document.getElementById("doneTitle").textContent = who;
      var bars = document.getElementById("bars");
      bars.replaceChildren();
      [["Desarrollo personal", personal], ["Vínculos", vinculos], ["Habilidades para la vida", vida]].forEach(function (row) {
        var wrap = document.createElement("div");
        wrap.innerHTML =
          '<div class="bar-top"><span>' + row[0] + '</span><span>' + row[1] + " · " + band(row[1]) + '</span></div>' +
          '<div class="track"><div class="fill" data-w="' + row[1] + '"></div></div>';
        bars.appendChild(wrap);
      });
      document.getElementById("iie").textContent = String(iie);
      document.getElementById("bossNote").textContent =
        "Esto salió de la partida: si levantaste lo que se cayó, si abriste el corazón y si seguiste el plan. La lectura de las barras es la misma del reporte socioemocional. No es la prueba completa.";
      show("done");
      say(AUDIO + "listo.mp3");
      requestAnimationFrame(function () {
        document.querySelectorAll(".fill").forEach(function (el) { el.style.width = el.getAttribute("data-w") + "%"; });
      });
    }

    document.getElementById("btnOir").addEventListener("click", function () {
      say(AUDIO + "instrucciones.mp3");
    });
    document.getElementById("btnReplay").addEventListener("click", function () { say(lastVoice); });
    document.getElementById("btnMute").addEventListener("click", function () {
      muted = !muted;
      document.getElementById("btnMute").classList.toggle("off", muted);
      if (muted) voice.pause();
    });
    document.getElementById("btnJugar").addEventListener("click", function () {
      if (!nombre.value.trim()) {
        nombre.classList.add("need");
        nombre.focus();
        return;
      }
      results = [];
      worldIndex = 0;
      hinted = false;
      beginLevel();
    });
    nombre.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") document.getElementById("btnJugar").click();
    });
    btnEntrar.addEventListener("click", function () {
      if (btnEntrar.dataset.mode === "next") {
        worldIndex++;
        openSplash();
        return;
      }
      beginLevel();
    });
    document.getElementById("btnOtra").addEventListener("click", function () {
      voice.pause();
      show("home");
      lastVoice = AUDIO + "instrucciones.mp3";
    });
  </script>
</body>
</html>
